# Blueprint de deploy para o Render (https://render.com)
# 1) Suba este projeto para um repositório no GitHub.
# 2) No Render: New > Blueprint > selecione o repositório.
# Obs.: no plano gratuito o disco é efêmero — os dados do SQLite são reiniciados
# a cada novo deploy/reinício. Para dados permanentes, use um disco pago (abaixo)
# ou migre para PostgreSQL.
services:
  - type: web
    name: sigoe
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend app:app --bind 0.0.0.0:$PORT
    # Para dados permanentes (plano pago), descomente:
    # disk:
    #   name: sigoe-data
    #   mountPath: /opt/render/project/src/backend
    #   sizeGB: 1
